server.port=${PORT:8081}
logging.level.org.atmosphere = warn
spring.mustache.check-template-location = false
server.servlet.context-path=/work
# Shiro web 过滤器保持开启（默认）：过滤器每次请求把 SecurityManager/request 绑定到
# ThreadContext，SecurityUtils.getSubject() 与登录会话依赖它。过滤链在
# ShiroConfiguration#shiroFilterChainDefinition 中定义为 /** = anon（全放行），
# URL 鉴权由 Vaadin LoginView 内的 Subject.login() 流程负责，过滤器只做绑定不拦截。
# loginUrl 仅作兜底（anon 链下不会触发跳转）。
shiro.loginUrl=/
spring.banner.charset=UTF-8
server.servlet.session.persistent=false
spring.profiles.active=dev
# Launch the default browser when starting the application in development mode
vaadin.launch-browser=false
# To improve the performance during development.
# For more information https://vaadin.com/docs/flow/spring/tutorial-spring-configuration.html#special-configuration-parameters
vaadin.whitelisted-packages = com.vaadin,org.vaadin,com.example.application
spring.jpa.defer-datasource-initialization = false

#spring默认限制大小为10MB，maxFileSize 是单个文件大小，maxRequestSize是设置总上传的数据大小
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=500MB

mybatis-plus.config-location=classpath:/mybatis/configuration.xml
mybatis-plus.mapper-locations=classpath:/mapping/*.xml

# 数据库结构维护约定：
# 不再使用 Flyway 版本化迁移，唯一权威脚本为 institutions.sql，
# 每次发布前手工更新一次（含全量建表与菜单/字典数据），由 DBA / 部署人员按需导入。

server.session.persistent=false
#
# 文件存储根目录（跨平台）。可用环境变量 APP_STORAGE_DIR 覆盖；默认放在当前用户主目录下。
# 旧配置 user.file.path=d:\\ 已废弃：硬编码盘符导致 Linux 部署必然失败，
# 且原先通过 ResourceBundle 读取，绕过了 Spring 的配置体系（环境变量 / profile 覆盖都失效）。
# 现在统一由 com.sl.config.StorageProperties 托管。
app.storage.base-dir=${APP_STORAGE_DIR:${user.home}/.workingcoo/storage}
spring.devtools.restart.exclude=VAADIN/**,userGuide.txt,todoList.txt
# the uploadDemo Dir for test
upload.custom.dir=${app.storage.base-dir}/demo

# ---------------------------------------------------------------------------
# Actuator（T3-5）
# 只暴露 health / info / metrics：health 给容器探活，info 看版本，metrics 看 JVM 与 HTTP 指标。
# 不暴露 env / beans / heapdump / threaddump —— 这些会把数据源密码、内部 Bean 结构直接吐出去。
# 注意：Shiro 过滤链是 /** = anon，Actuator 端点因此是裸奔的；
# 生产环境请在网关 / Nginx 上把 /actuator/** 限制为内网访问（见 docs/troubleshooting.md）。
# ---------------------------------------------------------------------------
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=workingCoo
management.info.env.enabled=true
info.app.name=WorkingCoo
info.app.description=任务协作与项目管理

# 日志：使用 log4j2-spring.xml（log4j2 实现），级别可在下面按 logging.level.* 覆盖
logging.level.com.sl=info
